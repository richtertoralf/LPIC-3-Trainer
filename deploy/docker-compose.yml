# Run from the repository root: docker compose -f deploy/docker-compose.yml up -d
services:
  lpic3-trainer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lpic3-trainer:local
    container_name: lpic3-trainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LPIC3_SECURE_COOKIES: "false"
      LPIC3_SESSION_HOURS: "720"
    volumes:
      - lpic3-data:/var/lib/lpic3-trainer

volumes:
  lpic3-data:
