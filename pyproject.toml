[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lpic3-trainer"
version = "0.0.5"
description = "Targeted preparation for the English-language LPIC-3 exams: technical English training at the exam questions, with German help"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "pytest-playwright>=0.5",
    "ruff>=0.4",
]

[project.scripts]
lpic3ctl = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI convention

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
