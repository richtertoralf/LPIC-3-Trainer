{% extends "base.html" %}
{% block title %}Konto · LPIC-3 Trainer{% endblock %}
{% block content %}
<h1>Mein Konto</h1>
<section class="card narrow">
  <p>Benutzername: <strong>{{ user.username }}</strong> · Rolle: {{ {'admin': 'Administrator', 'supervisor': 'Betreuer', 'learner': 'Lernender'}[user.role] }}</p>
  <form method="post" action="/account/profile">
    <label>Anzeigename<input name="display_name" value="{{ user.display_name }}"></label>
    <button class="btn" type="submit">Speichern</button>
  </form>
</section>
<section class="card narrow">
  <h2>Passwort ändern</h2>
  <form method="post" action="/account/password">
    <label>Aktuelles Passwort<input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>Neues Passwort<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Neues Passwort wiederholen<input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">Passwort ändern</button>
  </form>
</section>
{% endblock %}
